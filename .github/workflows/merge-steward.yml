# MANGU Merge Steward — freeze-mode (F-12).
#
# Why this workflow is restricted:
#   The repo is under a feature freeze (#209): most launch gates are unmet and
#   every merge to main auto-deploys production via Vercel. Arming auto-merge
#   for every open PR is therefore unsafe. The steward now arms auto-merge
#   ONLY for PRs a human has explicitly approved by applying the
#   `steward-approved` label (freeze-exempt work: minimal recovery repairs /
#   security fixes).
#
# How to approve a PR for auto-merge:
#   1. Review the PR and confirm it qualifies under the freeze policy.
#   2. Apply the `steward-approved` label. The steward arms a squash
#      auto-merge immediately (labeled event) or on the next hourly sweep;
#      branch protection checks still gate the actual merge.
#   To back out: remove the label AND run `gh pr merge <n> --disable-auto`
#   (removing the label alone does not disarm an already-armed merge).

name: MANGU Merge Steward

on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: mangu-merge-steward
  cancel-in-progress: false

jobs:
  process-pull-requests:
    name: Process pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Select pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            # Guard: only the human-applied approval label may arm auto-merge.
            if [[ "$EVENT_LABEL" != "steward-approved" ]]; then
              echo "Label '$EVENT_LABEL' is not 'steward-approved'; nothing to do."
              exit 0
            fi
            if [[ "$EVENT_DRAFT" == "true" ]]; then
              echo "PR #$EVENT_PR is a draft; the hourly sweep will pick it up once it is marked ready (label kept)."
              exit 0
            fi
            printf '%s\n' "$EVENT_PR" > /tmp/prs.txt
          else
            # Scheduled/manual sweep: only PRs a human labeled `steward-approved`.
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --state open \
              --label steward-approved \
              --json number,isDraft \
              --jq '.[] | select(.isDraft == false) | .number' > /tmp/prs.txt
          fi

          echo "Selected pull requests:"
          cat /tmp/prs.txt

      - name: Arm autonomous squash merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -s /tmp/prs.txt ]]; then
            echo "No ready pull requests found."
            exit 0
          fi

          while IFS= read -r pr; do
            echo "Processing PR #$pr"
            gh pr merge "$pr" \
              --repo "$GITHUB_REPOSITORY" \
              --squash \
              --auto || echo "::warning title=Merge Steward blocked::PR #$pr could not be merged or armed for auto-merge."
          done < /tmp/prs.txt
